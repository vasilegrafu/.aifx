<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>exposure-bars — showcase</title>
  <link rel="stylesheet" href="../../../../css/bundle.css"
        onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/gh/vasilegrafu/aifx-finance@8.7.0/.claude/skills/finance-reports/css/bundle.css'">
  <script src="../../../../js/bundle.js" defer
          onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/gh/vasilegrafu/aifx-finance@8.7.0/.claude/skills/finance-reports/js/bundle.js';document.head.appendChild(s)"></script>
</head>
<body>
  <main>
  <header class="doc-meta">
    <p class="doc-type">component showcase</p>
    <h1>exposure-bars</h1>
  </header>

    <section>
      <h3>sector exposure, with the amount each percentage implies</h3>
        <figure class="portfolio-exposure">
<figcaption>Sector exposure, $2,450m</figcaption>    <div class="portfolio-exposure-row">
      <span class="portfolio-exposure-label">Technology</span>
      <span class="portfolio-exposure-track"><span class="portfolio-exposure-fill" data-pct="30.3%"></span></span>
      <span class="portfolio-exposure-value">30.3% <em>$742m</em></span>
    </div>
    <div class="portfolio-exposure-row">
      <span class="portfolio-exposure-label">Financials</span>
      <span class="portfolio-exposure-track"><span class="portfolio-exposure-fill" data-pct="13.7%"></span></span>
      <span class="portfolio-exposure-value">13.7% <em>$336m</em></span>
    </div>
    <div class="portfolio-exposure-row">
      <span class="portfolio-exposure-label">Industrials</span>
      <span class="portfolio-exposure-track"><span class="portfolio-exposure-fill" data-pct="15.2%"></span></span>
      <span class="portfolio-exposure-value">15.2% <em>$372m</em></span>
    </div>
    <div class="portfolio-exposure-row">
      <span class="portfolio-exposure-label">Healthcare</span>
      <span class="portfolio-exposure-track"><span class="portfolio-exposure-fill" data-pct="9.8%"></span></span>
      <span class="portfolio-exposure-value">9.8% <em>$240m</em></span>
    </div>
    <div class="portfolio-exposure-row">
      <span class="portfolio-exposure-label">Energy</span>
      <span class="portfolio-exposure-track"><span class="portfolio-exposure-fill" data-pct="8.3%"></span></span>
      <span class="portfolio-exposure-value">8.3% <em>$203m</em></span>
    </div>
    <div class="portfolio-exposure-row">
      <span class="portfolio-exposure-label">Consumer</span>
      <span class="portfolio-exposure-track"><span class="portfolio-exposure-fill" data-pct="7.1%"></span></span>
      <span class="portfolio-exposure-value">7.1% <em>$174m</em></span>
    </div>
    <div class="portfolio-exposure-row">
      <span class="portfolio-exposure-label">Materials</span>
      <span class="portfolio-exposure-track"><span class="portfolio-exposure-fill" data-pct="6.2%"></span></span>
      <span class="portfolio-exposure-value">6.2% <em>$152m</em></span>
    </div>
    <div class="portfolio-exposure-row">
      <span class="portfolio-exposure-label">Cash</span>
      <span class="portfolio-exposure-track"><span class="portfolio-exposure-fill" data-pct="9.4%"></span></span>
      <span class="portfolio-exposure-value">9.4% <em>$230m</em></span>
    </div>
  </figure>

    </section>
  </main>
</body>
</html>
