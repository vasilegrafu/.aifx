<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cycle-position — showcase</title>
  <link rel="stylesheet" href="../../../../css/bundle.css"
        onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/gh/vasilegrafu/aifx-finance@8.5.0/.claude/skills/finance-reports/css/bundle.css'">
  <script src="../../../../js/bundle.js" defer
          onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/gh/vasilegrafu/aifx-finance@8.5.0/.claude/skills/finance-reports/js/bundle.js';document.head.appendChild(s)"></script>
</head>
<body>
  <main>
  <header class="doc-meta">
    <p class="doc-type">component showcase</p>
    <h1>cycle-position</h1>
  </header>

    <section>
      <h3>four phases with the third marked current</h3>
        <figure class="macro-cycle">
    <ol class="macro-cycle-band">
      <li class="macro-cycle-phase">
        <span class="macro-cycle-label">Early expansion</span>
<span class="macro-cycle-note">Credit loosening, spare capacity</span>      </li>
      <li class="macro-cycle-phase">
        <span class="macro-cycle-label">Mid expansion</span>
<span class="macro-cycle-note">Capacity tightening, margins peak</span>      </li>
      <li class="macro-cycle-phase macro-current" aria-current="true">
        <span class="macro-cycle-label">Late expansion</span>
<span class="macro-cycle-note">Wage pressure, policy turns restrictive</span>      </li>
      <li class="macro-cycle-phase">
        <span class="macro-cycle-label">Contraction</span>
<span class="macro-cycle-note">Inventories clear, defaults rise</span>      </li>
    </ol>
    <figcaption>Wage growth of 4.6% against 2.1% productivity puts the cycle late rather than mid. <span class="macro-cycle-asof">July 2026</span></figcaption>
  </figure>

    </section>
  </main>
</body>
</html>
