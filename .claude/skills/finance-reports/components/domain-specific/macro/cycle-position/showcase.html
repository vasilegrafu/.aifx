<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cycle-position — showcase</title>
  <link rel="stylesheet" href="../../../../css/bundle.css">
  <script src="../../../../js/bundle.js" defer></script>
</head>
<body>
  <main>
  <header class="doc-meta">
    <p class="doc-type">component showcase</p>
    <h1>cycle-position</h1>
  </header>

    <section>
      <h3>four phases with the third marked current</h3>
        <figure class="macro-cycle-position">
    <ol class="macro-cycle-position-band">
      <li class="macro-cycle-position-phase">
        <span class="macro-cycle-position-label">Early expansion</span>
<span class="macro-cycle-position-note">Credit loosening, spare capacity</span>      </li>
      <li class="macro-cycle-position-phase">
        <span class="macro-cycle-position-label">Mid expansion</span>
<span class="macro-cycle-position-note">Capacity tightening, margins peak</span>      </li>
      <li class="macro-cycle-position-phase macro-current" aria-current="true">
        <span class="macro-cycle-position-label">Late expansion</span>
<span class="macro-cycle-position-note">Wage pressure, policy turns restrictive</span>      </li>
      <li class="macro-cycle-position-phase">
        <span class="macro-cycle-position-label">Contraction</span>
<span class="macro-cycle-position-note">Inventories clear, defaults rise</span>      </li>
    </ol>
    <figcaption>Wage growth of 4.6% against 2.1% productivity puts the cycle late rather than mid. <span class="macro-cycle-position-asof">July 2026</span></figcaption>
  </figure>

    </section>
  </main>
</body>
</html>
