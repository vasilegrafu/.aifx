<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

<body>
  <main>
  <header class="doc-meta">
    <p class="doc-type">component showcase</p>
    <h1>valuation-range</h1>
  </header>

    <section>
      <h3>four methods and the traded price — the standard form</h3>
        <figure class="fa-valuation-range">
<figcaption>Valuation range by method, USD per share</figcaption>    <div>
      <div class="fa-valuation-range-row">
        <span class="fa-valuation-range-method">DCF, 9% WACC</span>
        <span class="fa-valuation-range-track">
          <span class="fa-valuation-range-bar" data-lo="61.25%" data-span="21.25%"></span>
<span class="fa-valuation-range-mark" data-at="74.0%"></span>        </span>
        <span class="fa-valuation-range-value">$98 – $132</span>
      </div>
      <div class="fa-valuation-range-row">
        <span class="fa-valuation-range-method">EV / EBITDA, peer median</span>
        <span class="fa-valuation-range-track">
          <span class="fa-valuation-range-bar" data-lo="46.25%" data-span="19.38%"></span>
<span class="fa-valuation-range-mark" data-at="74.0%"></span>        </span>
        <span class="fa-valuation-range-value">$74 – $105</span>
      </div>
      <div class="fa-valuation-range-row">
        <span class="fa-valuation-range-method">P/E, 5-year average</span>
        <span class="fa-valuation-range-track">
          <span class="fa-valuation-range-bar" data-lo="55.0%" data-span="20.62%"></span>
<span class="fa-valuation-range-mark" data-at="74.0%"></span>        </span>
        <span class="fa-valuation-range-value">$88 – $121</span>
      </div>
      <div class="fa-valuation-range-row">
        <span class="fa-valuation-range-method">Sum of the parts</span>
        <span class="fa-valuation-range-track">
          <span class="fa-valuation-range-bar" data-lo="68.75%" data-span="28.75%"></span>
<span class="fa-valuation-range-mark" data-at="74.0%"></span>        </span>
        <span class="fa-valuation-range-value">$110 – $156</span>
      </div>
    </div>
    <p class="fa-valuation-range-axis"><span>$0</span><span class="fa-valuation-range-price">$118</span><span>$160</span></p>
  </figure>

    </section>
    <hr>
    <section>
      <h3>two methods that barely overlap — where the spread is the finding</h3>
        <figure class="fa-valuation-range">
<figcaption>Going concern against liquidation, USD per share</figcaption>    <div>
      <div class="fa-valuation-range-row">
        <span class="fa-valuation-range-method">DCF, 9% WACC</span>
        <span class="fa-valuation-range-track">
          <span class="fa-valuation-range-bar" data-lo="61.25%" data-span="21.25%"></span>

      </div>
      <div class="fa-valuation-range-row">
        <span class="fa-valuation-range-method">Liquidation value</span>
        <span class="fa-valuation-range-track">
          <span class="fa-valuation-range-bar" data-lo="25.62%" data-span="10.62%"></span>
<span class="fa-valuation-range-mark" data-at="74.0%"></span>        </span>
