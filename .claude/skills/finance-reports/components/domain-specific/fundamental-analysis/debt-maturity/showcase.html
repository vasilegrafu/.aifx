<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>debt-maturity — showcase</title>
  <link rel="stylesheet" href="../../../../css/bundle.css"
        onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/gh/vasilegrafu/aifx-finance@8.7.0/.claude/skills/finance-reports/css/bundle.css'">
  <script src="../../../../js/bundle.js" defer
          onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/gh/vasilegrafu/aifx-finance@8.7.0/.claude/skills/finance-reports/js/bundle.js';document.head.appendChild(s)"></script>
</head>
<body>
  <main>
  <header class="doc-meta">
    <p class="doc-type">component showcase</p>
    <h1>debt-maturity</h1>
  </header>

    <section>
      <h3>a laddered stack — no year carries much more than the others</h3>
        <figure class="maturity">
<figcaption>Debt maturity profile <span class="fa-st-unit">principal outstanding</span></figcaption>    <div class="fa-maturity-rows">
      <div class="fa-maturity-row">
        <span class="fa-maturity-period">FY26</span>
        <span class="fa-maturity-track"><span class="fa-maturity-fill" data-pct="4.6%"></span></span>
        <span class="fa-maturity-amount">$180m</span>
        <span class="fa-maturity-rate">3.9%</span>
        <span class="fa-maturity-instrument">Revolving facility</span>
      </div>
      <div class="fa-maturity-row">
        <span class="fa-maturity-period">FY27</span>
        <span class="fa-maturity-track"><span class="fa-maturity-fill" data-pct="19.4%"></span></span>
        <span class="fa-maturity-amount">$750m</span>
        <span class="fa-maturity-rate">2.95%</span>
        <span class="fa-maturity-instrument">Senior notes</span>
      </div>
      <div class="fa-maturity-row">
        <span class="fa-maturity-period">FY29</span>
        <span class="fa-maturity-track"><span class="fa-maturity-fill" data-pct="28.4%"></span></span>
        <span class="fa-maturity-amount">$1,100m</span>
        <span class="fa-maturity-rate">4.375%</span>
        <span class="fa-maturity-instrument">Senior notes</span>
      </div>
      <div class="fa-maturity-row">
        <span class="fa-maturity-period">FY32</span>
        <span class="fa-maturity-track"><span class="fa-maturity-fill" data-pct="32.1%"></span></span>
        <span class="fa-maturity-amount">$1,241m</span>
        <span class="fa-maturity-rate">3.75%</span>
        <span class="fa-maturity-instrument">Senior notes</span>
      </div>
      <div class="fa-maturity-row">
        <span class="fa-maturity-period">FY45</span>
        <span class="fa-maturity-track"><span class="fa-maturity-fill" data-pct="15.5%"></span></span>
        <span class="fa-maturity-amount">$600m</span>
        <span class="fa-maturity-rate">5.125%</span>
        <span class="fa-maturity-instrument">Senior notes</span>
      </div>
    </div>
<p class="maturity-summary">Well laddered: nothing above a third falls in any one year.</p>  </figure>

    </section>
    <hr>
    <section>
      <h3>a maturity wall — 86% in a single year, at the highest coupon</h3>
        <figure class="maturity">
<figcaption>Debt maturity profile <span class="fa-st-unit">principal outstanding</span></figcaption>    <div class="fa-maturity-rows">
      <div class="fa-maturity-row">
        <span class="fa-maturity-period">FY26</span>
        <span class="fa-maturity-track"><span class="fa-maturity-fill" data-pct="4.0%"></span></span>
        <span class="fa-maturity-amount">$120m</span>
        <span class="fa-maturity-rate">4.1%</span>
        <span class="fa-maturity-instrument">Term loan</span>
      </div>
      <div class="fa-maturity-row">
        <span class="fa-maturity-period">FY27</span>
        <span class="fa-maturity-track"><span class="fa-maturity-fill" data-pct="86.0%"></span></span>
        <span class="fa-maturity-amount">$2,580m</span>
        <span class="fa-maturity-rate">6.25%</span>
        <span class="fa-maturity-instrument">Senior notes</span>
      </div>
      <div class="fa-maturity-row">
        <span class="fa-maturity-period">FY30</span>
        <span class="fa-maturity-track"><span class="fa-maturity-fill" data-pct="10.0%"></span></span>
        <span class="fa-maturity-amount">$300m</span>
        <span class="fa-maturity-rate">5.5%</span>
        <span class="fa-maturity-instrument">Senior notes</span>
      </div>
    </div>
<p class="maturity-summary">FY27 is the whole refinancing risk, and it carries the worst rate.</p>  </figure>

    </section>
  </main>
</body>
</html>
