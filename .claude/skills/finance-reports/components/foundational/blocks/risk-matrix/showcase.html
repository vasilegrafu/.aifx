<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>risk-matrix — showcase</title>
  <link rel="stylesheet" href="../../../../css/bundle.css"
        onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/gh/vasilegrafu/aifx-finance@11.0.0/.claude/skills/finance-reports/css/bundle.css'">
  <script src="../../../../js/bundle.js" defer
          onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/gh/vasilegrafu/aifx-finance@11.0.0/.claude/skills/finance-reports/js/bundle.js';document.head.appendChild(s)"></script>
</head>
<body>
  <main>
  <header class="doc-meta">
    <p class="doc-type">component showcase</p>
    <h1>risk-matrix</h1>
  </header>

    <section>
      <h3>six risks across the grid — one in each severity band</h3>
        <div class="risk-matrix" role="img" aria-label="probability by impact risk matrix">
    <span class="risk-matrix-corner">P \ I</span>
    <span class="risk-matrix-axis">1</span>
    <span class="risk-matrix-axis">2</span>
    <span class="risk-matrix-axis">3</span>
    <span class="risk-matrix-axis">4</span>
    <span class="risk-matrix-axis">5</span>
    <span class="risk-matrix-axis">5</span>
      <span class="risk-matrix-cell risk-matrix-med">
      </span>
      <span class="risk-matrix-cell risk-matrix-med">
      </span>
      <span class="risk-matrix-cell risk-matrix-high">
      </span>
      <span class="risk-matrix-cell risk-matrix-high">
<span class="risk-matrix-chip" title="Single-source supplier for the controller board">R1</span>      </span>
      <span class="risk-matrix-cell risk-matrix-high">
      </span>
    <span class="risk-matrix-axis">4</span>
      <span class="risk-matrix-cell risk-matrix-low">
      </span>
      <span class="risk-matrix-cell risk-matrix-med">
<span class="risk-matrix-chip" title="FX translation drag on reported revenue">R4</span>      </span>
      <span class="risk-matrix-cell risk-matrix-med">
      </span>
      <span class="risk-matrix-cell risk-matrix-high">
      </span>
      <span class="risk-matrix-cell risk-matrix-high">
      </span>
    <span class="risk-matrix-axis">3</span>
      <span class="risk-matrix-cell risk-matrix-low">
      </span>
      <span class="risk-matrix-cell risk-matrix-med">
      </span>
      <span class="risk-matrix-cell risk-matrix-med">
<span class="risk-matrix-chip" title="Platform migration slips past Q3">R6</span>      </span>
      <span class="risk-matrix-cell risk-matrix-med">
      </span>
      <span class="risk-matrix-cell risk-matrix-high">
<span class="risk-matrix-chip" title="Covenant breach if EBITDA falls a further 12%">R2</span>      </span>
    <span class="risk-matrix-axis">2</span>
      <span class="risk-matrix-cell risk-matrix-low">
      </span>
      <span class="risk-matrix-cell risk-matrix-low">
<span class="risk-matrix-chip" title="Key-person dependency in group tax">R3</span>      </span>
      <span class="risk-matrix-cell risk-matrix-med">
      </span>
      <span class="risk-matrix-cell risk-matrix-med">
      </span>
      <span class="risk-matrix-cell risk-matrix-med">
      </span>
    <span class="risk-matrix-axis">1</span>
      <span class="risk-matrix-cell risk-matrix-low">
      </span>
      <span class="risk-matrix-cell risk-matrix-low">
      </span>
      <span class="risk-matrix-cell risk-matrix-low">
      </span>
      <span class="risk-matrix-cell risk-matrix-low">
      </span>
      <span class="risk-matrix-cell risk-matrix-med">
<span class="risk-matrix-chip" title="Regulatory ban in the largest market">R5</span>      </span>
  </div>

    </section>
  </main>
</body>
</html>
