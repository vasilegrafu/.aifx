<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bridge — showcase</title>
  <link rel="stylesheet" href="../../../../css/bundle.css">
  <script src="../../../../js/bundle.js" defer></script>
</head>
<body>
  <main>
  <header class="doc-meta">
    <p class="doc-type">component showcase</p>
    <h1>bridge</h1>
  </header>

    <section>
      <h3>revenue, FY24 to FY25 — five movements landing on the endpoint</h3>
        <figure class="bridge">
<figcaption>FY24 to FY25 revenue, $m</figcaption>    <div class="bridge-rows">
      <div class="bridge-row bridge-start">
        <span class="bridge-label">FY24 revenue</span>
        <span class="bridge-track">
          <span class="bridge-bar" data-lo="0.0%" data-span="81.43%"></span>
        </span>
        <span class="bridge-value">34,200</span>
      </div>
      <div class="bridge-row bridge-up">
        <span class="bridge-label">New logos</span>
        <span class="bridge-track">
          <span class="bridge-bar" data-lo="81.43%" data-span="12.14%"></span>
        </span>
        <span class="bridge-value">+5,100</span>
      </div>
      <div class="bridge-row bridge-up">
        <span class="bridge-label">Expansion</span>
        <span class="bridge-track">
          <span class="bridge-bar" data-lo="93.57%" data-span="3.19%"></span>
        </span>
        <span class="bridge-value">+1,340</span>
      </div>
      <div class="bridge-row bridge-down">
        <span class="bridge-label">Churn</span>
        <span class="bridge-track">
          <span class="bridge-bar" data-lo="93.95%" data-span="2.81%"></span>
        </span>
        <span class="bridge-value">-1,180</span>
      </div>
      <div class="bridge-row bridge-down">
        <span class="bridge-label">FX translation</span>
        <span class="bridge-track">
          <span class="bridge-bar" data-lo="91.78%" data-span="2.17%"></span>
        </span>
        <span class="bridge-value">-911</span>
      </div>
      <div class="bridge-row bridge-end">
        <span class="bridge-label">FY25 revenue</span>
        <span class="bridge-track">
          <span class="bridge-bar" data-lo="0.0%" data-span="91.78%"></span>
        </span>
        <span class="bridge-value">38,549</span>
      </div>
    </div>
<p class="bridge-note">Organic growth of $5,260m is offset by $2,091m of churn and FX.</p>  </figure>

    </section>
    <hr>
    <section>
      <h3>a subtotal step, which resets the running total rather than adding to it</h3>
        <figure class="bridge">
<figcaption>FY24 to FY25 gross profit, $m</figcaption>    <div class="bridge-rows">
      <div class="bridge-row bridge-start">
        <span class="bridge-label">FY24 gross profit</span>
        <span class="bridge-track">
          <span class="bridge-bar" data-lo="0.0%" data-span="80.0%"></span>
        </span>
        <span class="bridge-value">17,600</span>
      </div>
      <div class="bridge-row bridge-up">
        <span class="bridge-label">Volume</span>
        <span class="bridge-track">
          <span class="bridge-bar" data-lo="80.0%" data-span="8.82%"></span>
        </span>
        <span class="bridge-value">+1,940</span>
      </div>
      <div class="bridge-row bridge-up">
        <span class="bridge-label">Price and mix</span>
        <span class="bridge-track">
          <span class="bridge-bar" data-lo="88.82%" data-span="3.73%"></span>
        </span>
        <span class="bridge-value">+820</span>
      </div>
      <div class="bridge-row bridge-subtotal">
        <span class="bridge-label">Before input cost</span>
        <span class="bridge-track">
          <span class="bridge-bar" data-lo="0.0%" data-span="92.55%"></span>
        </span>
        <span class="bridge-value">20,360</span>
      </div>
      <div class="bridge-row bridge-down">
        <span class="bridge-label">Input cost</span>
        <span class="bridge-track">
          <span class="bridge-bar" data-lo="88.09%" data-span="4.45%"></span>
        </span>
        <span class="bridge-value">-980</span>
      </div>
      <div class="bridge-row bridge-down">
        <span class="bridge-label">FX translation</span>
        <span class="bridge-track">
          <span class="bridge-bar" data-lo="86.73%" data-span="1.36%"></span>
        </span>
        <span class="bridge-value">-299</span>
      </div>
      <div class="bridge-row bridge-end">
        <span class="bridge-label">FY25 gross profit</span>
        <span class="bridge-track">
          <span class="bridge-bar" data-lo="0.0%" data-span="86.73%"></span>
        </span>
        <span class="bridge-value">19,081</span>
      </div>
    </div>
<p class="bridge-note">Gross profit rose $1,481m while margin fell 2.0pt — the mix, not the rate.</p>  </figure>

    </section>
  </main>
</body>
</html>
