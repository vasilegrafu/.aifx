<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>quadrant-map — showcase</title>
  <link rel="stylesheet" href="../../../../css/bundle.css"
        onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/gh/vasilegrafu/aifx-finance@10.0.0/.claude/skills/finance-reports/css/bundle.css'">
  <script src="../../../../js/bundle.js" defer
          onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/gh/vasilegrafu/aifx-finance@10.0.0/.claude/skills/finance-reports/js/bundle.js';document.head.appendChild(s)"></script>
</head>
<body>
  <main>
  <header class="doc-meta">
    <p class="doc-type">component showcase</p>
    <h1>quadrant-map</h1>
  </header>

    <section>
      <h3>five competitors placed by share and growth</h3>
        <figure class="quadrant">
<figcaption>Competitive position, FY25</figcaption>    <div class="quadrant-frame">
      <span class="quadrant-y-label">Revenue growth →</span>
      <div class="quadrant-plot">
<span class="quadrant-zone quadrant-z1">Challengers</span><span class="quadrant-zone quadrant-z2">Leaders</span><span class="quadrant-zone quadrant-z3">Niche</span><span class="quadrant-zone quadrant-z4">Incumbents</span>        <span class="quadrant-item quadrant-good" data-x="78%" data-y="72%">
          <span class="quadrant-dot"></span><span class="quadrant-label">Northwind</span>
        </span>
        <span class="quadrant-item" data-x="24%" data-y="81%">
          <span class="quadrant-dot"></span><span class="quadrant-label">Vertex</span>
        </span>
        <span class="quadrant-item" data-x="84%" data-y="28%">
          <span class="quadrant-dot"></span><span class="quadrant-label">Halcyon</span>
        </span>
        <span class="quadrant-item quadrant-bad" data-x="18%" data-y="22%">
          <span class="quadrant-dot"></span><span class="quadrant-label">Pemberly</span>
        </span>
        <span class="quadrant-item" data-x="52%" data-y="54%">
          <span class="quadrant-dot"></span><span class="quadrant-label">Arden</span>
        </span>
      </div>
      <span class="quadrant-x-label">Market share →</span>
    </div>
<p class="quadrant-note">Vertex grows fastest from the smallest base; Halcyon holds the most share and the least growth.</p>  </figure>

    </section>
  </main>
</body>
</html>
