<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>quadrant-map — showcase</title>
  <link rel="stylesheet" href="../../../../css/bundle.css">
  <script src="../../../../js/bundle.js" defer></script>
</head>
<body>
  <main>
  <header class="doc-meta">
    <p class="doc-type">component showcase</p>
    <h1>quadrant-map</h1>
  </header>

    <section>
      <h3>five competitors placed by share and growth</h3>
        <figure class="quadrant-map">
<figcaption>Competitive position, FY25</figcaption>    <div class="quadrant-map-frame">
      <span class="quadrant-map-y-label">Revenue growth →</span>
      <div class="quadrant-map-plot">
<span class="quadrant-map-zone quadrant-map-z1">Challengers</span><span class="quadrant-map-zone quadrant-map-z2">Leaders</span><span class="quadrant-map-zone quadrant-map-z3">Niche</span><span class="quadrant-map-zone quadrant-map-z4">Incumbents</span>        <span class="quadrant-map-item quadrant-map-good" data-x="78%" data-y="72%">
          <span class="quadrant-map-dot"></span><span class="quadrant-map-label">Northwind</span>
        </span>
        <span class="quadrant-map-item" data-x="24%" data-y="81%">
          <span class="quadrant-map-dot"></span><span class="quadrant-map-label">Vertex</span>
        </span>
        <span class="quadrant-map-item" data-x="84%" data-y="28%">
          <span class="quadrant-map-dot"></span><span class="quadrant-map-label">Halcyon</span>
        </span>
        <span class="quadrant-map-item quadrant-map-bad" data-x="18%" data-y="22%">
          <span class="quadrant-map-dot"></span><span class="quadrant-map-label">Pemberly</span>
        </span>
        <span class="quadrant-map-item" data-x="52%" data-y="54%">
          <span class="quadrant-map-dot"></span><span class="quadrant-map-label">Arden</span>
        </span>
      </div>
      <span class="quadrant-map-x-label">Market share →</span>
    </div>
<p class="quadrant-map-note">Vertex grows fastest from the smallest base; Halcyon holds the most share and the least growth.</p>  </figure>

    </section>
  </main>
</body>
</html>
