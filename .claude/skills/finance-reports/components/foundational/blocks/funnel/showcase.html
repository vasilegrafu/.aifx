<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>funnel — showcase</title>
  <link rel="stylesheet" href="../../../../css/bundle.css"
        onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/gh/vasilegrafu/aifx-finance@8.5.0/.claude/skills/finance-reports/css/bundle.css'">
  <script src="../../../../js/bundle.js" defer
          onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/gh/vasilegrafu/aifx-finance@8.5.0/.claude/skills/finance-reports/js/bundle.js';document.head.appendChild(s)"></script>
</head>
<body>
  <main>
  <header class="doc-meta">
    <p class="doc-type">component showcase</p>
    <h1>funnel</h1>
  </header>

    <section>
      <h3>market sizing — each width measured against the top, not the step above</h3>
        <figure class="funnel">
<figcaption>Market sizing, FY25</figcaption>    <div class="funnel-stages">
      <div class="funnel-stage">
        <span class="funnel-bar" data-pct="100%">
          <span class="funnel-label">Total addressable market</span>
          <span class="funnel-value">$412bn</span>
        </span>
      </div>
      <div class="funnel-stage">
        <span class="funnel-bar" data-pct="35.9%">
          <span class="funnel-label">Serviceable addressable market</span>
          <span class="funnel-value">$148bn</span>
        </span>
<span class="funnel-note">Regions where the product is licensed to sell</span>      </div>
      <div class="funnel-stage">
        <span class="funnel-bar" data-pct="12.6%">
          <span class="funnel-label">Serviceable obtainable market</span>
          <span class="funnel-value">$52bn</span>
        </span>
<span class="funnel-note">Segments the current product actually fits</span>      </div>
      <div class="funnel-stage">
        <span class="funnel-bar" data-pct="9.3%">
          <span class="funnel-label">FY25 revenue</span>
          <span class="funnel-value">$38.5bn</span>
        </span>
      </div>
    </div>
<p class="funnel-summary">Revenue is 9.3% of the total addressable market and 74% of the obtainable one.</p>  </figure>

    </section>
    <hr>
    <section>
      <h3>a conversion funnel, where the same rule is easiest to get wrong</h3>
        <figure class="funnel">
<figcaption>Trial to paid conversion, FY25</figcaption>    <div class="funnel-stages">
      <div class="funnel-stage">
        <span class="funnel-bar" data-pct="100%">
          <span class="funnel-label">Trial signups</span>
          <span class="funnel-value">128,400</span>
        </span>
      </div>
      <div class="funnel-stage">
        <span class="funnel-bar" data-pct="14.6%">
          <span class="funnel-label">Completed onboarding</span>
          <span class="funnel-value">18,776</span>
        </span>
      </div>
      <div class="funnel-stage">
        <span class="funnel-bar" data-pct="7.0%">
          <span class="funnel-label">Active at 30 days</span>
          <span class="funnel-value">9,012</span>
        </span>
      </div>
      <div class="funnel-stage">
        <span class="funnel-bar" data-pct="1.7%">
          <span class="funnel-label">Converted to paid</span>
          <span class="funnel-value">2,143</span>
        </span>
<span class="funnel-note">11.4% of those who finished onboarding</span>      </div>
    </div>
  </figure>

    </section>
  </main>
</body>
</html>
