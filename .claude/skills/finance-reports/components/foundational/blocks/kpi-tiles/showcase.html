<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kpi-tiles — showcase</title>
  <link rel="stylesheet" href="../../../../css/bundle.css"
        onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/gh/vasilegrafu/aifx-finance@8.8.0/.claude/skills/finance-reports/css/bundle.css'">
  <script src="../../../../js/bundle.js" defer
          onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/gh/vasilegrafu/aifx-finance@8.8.0/.claude/skills/finance-reports/js/bundle.js';document.head.appendChild(s)"></script>
</head>
<body>
  <main>
  <header class="doc-meta">
    <p class="doc-type">component showcase</p>
    <h1>kpi-tiles</h1>
  </header>

    <section>
      <h3>five headline metrics — two rising, two falling, one flat</h3>
        <div class="kpi-tiles">
    <div class="kpi">
      <span class="kpi-value">$38.5bn</span>
      <span class="kpi-label">FY25 revenue</span>
      <span class="kpi-trend up">+12.7%</span>
    </div>
    <div class="kpi">
      <span class="kpi-value">49.5%</span>
      <span class="kpi-label">Gross margin</span>
      <span class="kpi-trend down">-2.0pt</span>
    </div>
    <div class="kpi">
      <span class="kpi-value">$5.1bn</span>
      <span class="kpi-label">Net income</span>
      <span class="kpi-trend up">+6.2%</span>
    </div>
    <div class="kpi">
      <span class="kpi-value">13.3%</span>
      <span class="kpi-label">Net margin</span>
      <span class="kpi-trend down">-0.8pt</span>
    </div>
    <div class="kpi">
      <span class="kpi-value">1.24x</span>
      <span class="kpi-label">Net debt / EBITDA</span>
      <span class="kpi-trend flat">unchanged</span>
    </div>
  </div>

    </section>
  </main>
</body>
</html>
